<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets CRUD Webpage</title>
  <style>
    * { box-sizing: border-box; font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; padding: 20px; max-width: 900px; margin: auto; }
    h2 { color: #333; text-align: center; }
    
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    input { flex: 1; min-width: 180px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    
    button { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
    .btn-save { background-color: #28a745; }
    .btn-cancel { background-color: #6c757d; }
    .btn-edit { background-color: #ffc107; color: #000; padding: 5px 10px; margin-right: 5px; }
    .btn-delete { background-color: #dc3545; padding: 5px 10px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
    th { background-color: #007bff; color: white; }
    tr:hover { background-color: #f1f1f1; }
    
    #loading { text-align: center; font-weight: bold; color: #007bff; display: none; }
  </style>
</head>
<body>

  <h2>Google Sheets CRUD System</h2>

  <div class="card">
    <h3 id="form-title">Add New Record</h3>
    <form id="crud-form">
      <input type="hidden" id="record-id">
      <div class="form-group">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="role" placeholder="Role" required>
      </div>
      <button type="submit" class="btn-save" id="btn-submit">Save Record</button>
      <button type="button" class="btn-cancel" id="btn-cancel" onclick="resetForm()" style="display:none;">Cancel</button>
    </form>
  </div>

  <div class="card">
    <h3>Data Records</h3>
    <div id="loading">Processing...</div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Records render here -->
      </tbody>
    </table>
  </div>

  <script>
    // REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbx0pPjQtI3_nLKg4mxpKrcRF-4XIZHokD8ing9nZoJy3pfqHF2vQ-IecjMLA5f_Za6O/exec";
    
    document.addEventListener("DOMContentLoaded", fetchRecords);

    function showLoading(show) {
      document.getElementById("loading").style.display = show ? "block" : "none";
    }

    // READ: Fetch records from Spreadsheet
    async function fetchRecords() {
      showLoading(true);
      try {
        const response = await fetch(`${API_URL}?action=read`);
        const result = await response.json();
        
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        
        if (result.status === "success" && result.data.length > 0) {
          result.data.forEach(item => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${item.id}</td>
              <td>${item.name}</td>
              <td>${item.email}</td>
              <td>${item.role}</td>
              <td>
                <button class="btn-edit" onclick="editRecord('${item.id}', '${escapeQuotes(item.name)}', '${escapeQuotes(item.email)}', '${escapeQuotes(item.role)}')">Edit</button>
                <button class="btn-delete" onclick="deleteRecord('${item.id}')">Delete</button>
              </td>
            `;
            tbody.appendChild(row);
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No records found.</td></tr>';
        }
      } catch (err) {
        alert("Error fetching data: " + err);
      } finally {
        showLoading(false);
      }
    }

    // CREATE & UPDATE
    document.getElementById("crud-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      showLoading(true);

      const id = document.getElementById("record-id").value;
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const role = document.getElementById("role").value;

      const payload = {
        action: id ? "update" : "create",
        id: id,
        name: name,
        email: email,
        role: role
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        
        if (result.status === "success") {
          resetForm();
          fetchRecords();
        } else {
          alert("Operation failed: " + result.message);
        }
      } catch (err) {
        alert("Error saving record: " + err);
      } finally {
        showLoading(false);
      }
    });

    // DELETE
    async function deleteRecord(id) {
      if (!confirm("Are you sure you want to delete this record?")) return;
      showLoading(true);

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id: id })
        });
        const result = await res.json();
        
        if (result.status === "success") {
          fetchRecords();
        } else {
          alert("Delete failed: " + result.message);
        }
      } catch (err) {
        alert("Error deleting record: " + err);
      } finally {
        showLoading(false);
      }
    }

    // FORM HELPERS
    function editRecord(id, name, email, role) {
      document.getElementById("record-id").value = id;
      document.getElementById("name").value = name;
      document.getElementById("email").value = email;
      document.getElementById("role").value = role;

      document.getElementById("form-title").innerText = "Edit Record";
      document.getElementById("btn-submit").innerText = "Update Record";
      document.getElementById("btn-cancel").style.display = "inline-block";
    }

    function resetForm() {
      document.getElementById("crud-form").reset();
      document.getElementById("record-id").value = "";
      document.getElementById("form-title").innerText = "Add New Record";
      document.getElementById("btn-submit").innerText = "Save Record";
      document.getElementById("btn-cancel").style.display = "none";
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
